<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Virtual Tour of Italy - Day/Night Mode</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-assets>
        <a-asset-item id="domeModel" src="italy.glb"></a-asset-item>
        <img id="nightSky" src="https://cdn.aframe.io/360-image-gallery-boilerplate/img/sechelt.jpg" />
        <img id="daySky" src="https://cdn.aframe.io/a-painter/images/sky.jpg" />
      </a-assets>

      <a-sky id="sky" src="#daySky" color="#ECECEC"></a-sky>

      <a-entity light="type: ambient; intensity: 1" id="ambientLight"></a-entity>
      <a-entity light="type: directional; intensity: 1" position="1 3 1" id="dirLight"></a-entity>

      <a-entity gltf-model="#domeModel" scale="5 5 5" position="0 0 -5" rotation="0 180 0"></a-entity>

      <a-box id="toggleButton" position="1 2 -3" color="blue" scale="0.4 0.4 0.4" onclick="toggleMode()"></a-box>
      <a-text value="Toggle Day/Night" position="0.6 2.5 -3" color="black"></a-text>

      <a-camera position="0 1.6 0">
        <a-cursor color="black"></a-cursor>
      </a-camera>
    </a-scene>

    <script>
      let isDay = true;

      function toggleMode() {
        const sky = document.getElementById("sky");
        const ambientLight = document.getElementById("ambientLight");
        const dirLight = document.getElementById("dirLight");

        if (isDay) {
          sky.setAttribute("src", "#nightSky");
          ambientLight.setAttribute("light", "type: ambient; intensity: 0.3");
          dirLight.setAttribute("light", "type: directional; intensity: 0.2");
        } else {
          sky.setAttribute("src", "#daySky");
          ambientLight.setAttribute("light", "type: ambient; intensity: 1");
          dirLight.setAttribute("light", "type: directional; intensity: 1");
        }

        isDay = !isDay;
      }
    </script>
  </body>
</html>
